<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Bead Buddies social preview</title>
  <desc id="desc">A pastel Bead Buddies preview card with colourful glitter and character-print bead artwork.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9FA"/>
      <stop offset="0.42" stop-color="#FFEAF0"/>
      <stop offset="0.74" stop-color="#EFE5FF"/>
      <stop offset="1" stop-color="#E6FFF5"/>
    </linearGradient>
    <clipPath id="beadPhotoClip">
      <rect x="0" y="0" width="156" height="330" rx="34"/>
    </clipPath>
    <clipPath id="characterPhotoClip">
      <rect x="0" y="0" width="166" height="320" rx="34"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#5D3B4D" flood-opacity="0.22"/>
    </filter>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#F1A1B4" opacity="0.24"/>
      <circle cx="22" cy="25" r="2" fill="#D4C1EC" opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1040" cy="110" r="88" fill="#FCE181" opacity="0.58"/>
  <circle cx="104" cy="528" r="92" fill="#BDEBD7" opacity="0.5"/>
  <g filter="url(#shadow)">
    <rect x="78" y="86" width="1044" height="458" rx="44" fill="#FFFFFF" opacity="0.82"/>
    <rect x="78" y="86" width="1044" height="458" rx="44" fill="none" stroke="#2C2527" stroke-opacity="0.12" stroke-width="2"/>
  </g>
  <g transform="translate(145 135)" filter="url(#shadow)">
    <image href="glitter-round-beads-cartoon.webp" x="0" y="0" width="156" height="330" preserveAspectRatio="xMidYMid slice" clip-path="url(#beadPhotoClip)"/>
    <rect x="0" y="0" width="156" height="330" rx="34" fill="none" stroke="#F1A1B4" stroke-width="8"/>
  </g>
  <g transform="translate(920 142)" filter="url(#shadow)">
    <image href="character-print-beads-cartoon.webp" x="0" y="0" width="166" height="320" preserveAspectRatio="xMidYMid slice" clip-path="url(#characterPhotoClip)"/>
    <rect x="0" y="0" width="166" height="320" rx="34" fill="none" stroke="#62BF3D" stroke-width="8"/>
  </g>
  <g transform="translate(360 142)">
    <text x="0" y="58" fill="#E76F95" font-family="Pacifico, Fredoka, Arial, sans-serif" font-size="86">Bead</text>
    <text x="0" y="145" fill="#E76F95" font-family="Pacifico, Fredoka, Arial, sans-serif" font-size="86">Buddies</text>
    <text x="4" y="214" fill="#2C2527" font-family="Fredoka, Arial Rounded MT Bold, Arial, sans-serif" font-size="42" font-weight="800">Aussie bead lives</text>
    <text x="4" y="270" fill="#665A5F" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Custom beads, focals and charms</text>
    <text x="4" y="314" fill="#665A5F" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">claimed live on TikTok.</text>
    <g transform="translate(4 356)">
      <rect width="316" height="58" rx="29" fill="#FCE181" stroke="#2C2527" stroke-opacity="0.16" stroke-width="2"/>
      <text x="158" y="38" text-anchor="middle" fill="#2C2527" font-family="Fredoka, Arial Rounded MT Bold, Arial, sans-serif" font-size="26" font-weight="900">@beadbuddies8</text>
    </g>
  </g>
  <g transform="translate(560 80)" fill="none" stroke="#8A3F64" stroke-width="8" opacity="0.92">
    <circle cx="0" cy="0" r="22" fill="#BFE6FF"/>
    <circle cx="48" cy="-18" r="22" fill="#FCE181"/>
    <circle cx="96" cy="-10" r="22" fill="#D4C1EC"/>
    <circle cx="142" cy="16" r="22" fill="#FFF0F4"/>
    <circle cx="170" cy="60" r="22" fill="#F1A1B4"/>
  </g>
</svg>
