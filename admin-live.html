<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Live Toggle | Bead Buddies</title>
  <style>
    :root {
      --pink: #f1a1b4;
      --lilac: #d4c1ec;
      --cream: #fff9fa;
      --charcoal: #2c2527;
      --muted: #665a5f;
      --gold: #fce181;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--cream), #fff, #f4ecff);
      color: var(--charcoal);
      font-family: Inter, system-ui, sans-serif;
      padding: 1rem;
    }

    main {
      width: min(100%, 520px);
      border: 2px solid rgba(44, 37, 39, 0.82);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 22px 60px rgba(93, 59, 77, 0.16);
      padding: clamp(1.1rem, 5vw, 2rem);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 10vw, 3.2rem);
      line-height: 1;
    }

    p {
      color: var(--muted);
    }

    label {
      display: grid;
      gap: 0.4rem;
      margin: 1rem 0;
      font-weight: 800;
    }

    input {
      border: 2px solid rgba(44, 37, 39, 0.2);
      border-radius: 14px;
      padding: 0.8rem 0.9rem;
      font: inherit;
    }

    button,
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(44, 37, 39, 0.82);
      border-radius: 999px;
      color: var(--charcoal);
      padding: 0.75rem 1rem;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      background: var(--pink);
    }

    button.offline {
      background: var(--lilac);
    }

    a {
      background: var(--gold);
    }

    .actions {
      display: grid;
      gap: 0.75rem;
    }

    .status {
      border-radius: 18px;
      background: #fff5d1;
      padding: 0.8rem 0.9rem;
      color: var(--charcoal);
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <h1>TikTok Live toggle</h1>
    <p>Use this tiny admin panel to manually show or hide the Bead Buddies Live Now badge.</p>
    <label>
      Admin token
      <input id="token" type="password" autocomplete="current-password" placeholder="Paste LIVE_ADMIN_TOKEN">
    </label>
    <div class="actions">
      <button type="button" data-live="true">Set Live Now</button>
      <button class="offline" type="button" data-live="false">Set Offline</button>
      <a href="index.html">Back to site</a>
    </div>
    <p class="status" id="status">Checking current status...</p>
  </main>

  <script>
    const tokenInput = document.querySelector("#token");
    const statusBox = document.querySelector("#status");

    tokenInput.value = localStorage.getItem("beadBuddiesLiveToken") || "";

    async function loadStatus() {
      try {
        const response = await fetch("/api/live-status");
        const status = await response.json();
        statusBox.textContent = status.live ? "Current status: Live Now" : "Current status: Offline";
      } catch (error) {
        statusBox.textContent = "Live status is only available on the Cloudflare Pages deployment.";
      }
    }

    async function setLive(live) {
      const token = tokenInput.value.trim();
      localStorage.setItem("beadBuddiesLiveToken", token);
      statusBox.textContent = "Updating...";

      try {
        const response = await fetch("/api/live-toggle", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ live })
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || "Toggle failed");
        }

        statusBox.textContent = result.live ? "Updated: Live Now" : "Updated: Offline";
      } catch (error) {
        statusBox.textContent = `Could not update status: ${error.message}`;
      }
    }

    document.querySelectorAll("[data-live]").forEach((button) => {
      button.addEventListener("click", () => setLive(button.dataset.live === "true"));
    });

    loadStatus();
  </script>
</body>
</html>
